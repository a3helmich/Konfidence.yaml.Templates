parameters:
- name: githubPrefix
  type: string
  default: Konfidence
- name: githubRepoNameOverride
  type: string
  default: ''

steps:

- bash: echo "##vso[task.setvariable variable=githubRepoName]${{ coalesce(parameters.githubRepoNameOverride, format('{0}.$(Build.Repository.Name)', parameters.githubPrefix)) }}"
  displayName: 'Determine GitHub repo name'

- task: Bash@3
  displayName: 'Bash Script: push to github'
  condition: succeededOrFailed()
  continueOnError: true
  inputs:
    targetType: inline
    script: |
      {

      git branch -r \
         | grep -v '\->' \
         | grep -v 'origin/master' \
         | grep -v 'origin/main' \
         | while read origin;
               do
                  echo + git checkout -B "${origin#origin/}" "$origin";
                  git checkout -B "${origin#origin/}" "$origin";

                  echo - git pull @github.com/a3helmich/$(githubRepoName).git;
                  git pull https://$(GitHubToken)@github.com/a3helmich/$(githubRepoName).git;

                  echo - git push @github.com/a3helmich/$(githubRepoName).git "${origin#origin/}";
                  git push https://$(GitHubToken)@github.com/a3helmich/$(githubRepoName).git "${origin#origin/}";

                  echo - checkout --detach;
                  git checkout --detach;
               done;
      }
    workingDirectory: ''
    failOnStderr: false
    noProfile: true
    noRc: true
