parameters:
- name: githubPrefix
  type: string
  default: Konfidence
- name: githubRepoNameOverride
  type: string
  default: ''

steps:

- ${{ if ne(parameters.githubRepoNameOverride, '') }}:
  - task: Bash@3
    displayName: 'Bash Script: push to github'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        {

        git branch -r \
           | grep -v '\->' \
           | grep -v 'origin/master' \
           | grep -v 'origin/main' \
           | while read origin;
                 do
                    echo + git checkout -B "${origin#origin/}" "$origin";
                    git checkout -B "${origin#origin/}" "$origin";

                    echo - git pull @github.com/a3helmich/${{ parameters.githubRepoNameOverride }}.git;
                    git pull https://$(GitHubToken)@github.com/a3helmich/${{ parameters.githubRepoNameOverride }}.git;

                    echo - git push @github.com/a3helmich/${{ parameters.githubRepoNameOverride }}.git "${origin#origin/}";
                    git push https://$(GitHubToken)@github.com/a3helmich/${{ parameters.githubRepoNameOverride }}.git "${origin#origin/}";

                    echo - checkout --detach;
                    git checkout --detach;
                 done;
        }
      workingDirectory: ''
      failOnStderr: false
      noProfile: true
      noRc: true

- ${{ else }}:
  - task: Bash@3
    displayName: 'Bash Script: push to github'
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        {

        git branch -r \
           | grep -v '\->' \
           | grep -v 'origin/master' \
           | grep -v 'origin/main' \
           | while read origin;
                 do
                    echo + git checkout -B "${origin#origin/}" "$origin";
                    git checkout -B "${origin#origin/}" "$origin";

                    echo - git pull @github.com/a3helmich/${{ parameters.githubPrefix }}.$(Build.Repository.Name).git;
                    git pull https://$(GitHubToken)@github.com/a3helmich/${{ parameters.githubPrefix }}.$(Build.Repository.Name).git;

                    echo - git push @github.com/a3helmich/${{ parameters.githubPrefix }}.$(Build.Repository.Name).git "${origin#origin/}";
                    git push https://$(GitHubToken)@github.com/a3helmich/${{ parameters.githubPrefix }}.$(Build.Repository.Name).git "${origin#origin/}";

                    echo - checkout --detach;
                    git checkout --detach;
                 done;
        }
      workingDirectory: ''
      failOnStderr: false
      noProfile: true
      noRc: true
